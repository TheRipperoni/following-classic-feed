[workspace]
members = ["crypto", "db-schema", "feedgen", "identity", "lexicon", "syntax", "janitor", "jetstream"]
resolver = "2"

[workspace.dependencies]
lexicon = {path = "lexicon", version = "0.2.0"}
identity = {path = "identity", version = "0.1.0"}
crypto = {path = "crypto", version = "0.1.0"}
db-schema = {path = "db-schema", version = "0.1.0"}
syntax = {path = "syntax", version = "0.1.0"}

# Commonly shared external dependencies (version-pinned at workspace level)
anyhow = "1.0.102"
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum = { version = "0.8.9", features = ["macros"] }

[profile.release]
debug = 2  # Or any level from 0 to 2