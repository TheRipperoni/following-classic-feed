[workspace]
members = ["crypto", "feedgen", "identity", "lexicon", "syntax", "janitor", "jetstream"]
resolver = "2"

[workspace.dependencies]
cargo = { version = "0.94.0",features = ["vendored-openssl"] }
lexicon = {path = "lexicon", version = "0.2.0"}
identity = {path = "identity", version = "0.1.0"}
crypto = {path = "crypto", version = "0.1.0"}
syntax = {path = "syntax", version = "0.1.0"}

[profile.release]
debug = 2  # Or any level from 0 to 2