[package]
name = "jetstream"
version = "0.1.0"
authors = ["Ripperoni <email@ripperoni.com>"]
description = "A framework for subscribing to the AT Protocol Jetstream, in Rust."
license = "Apache-2.0"
edition = "2021"
publish = true

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lexicon = { workspace = true }
futures = "0.3.28"
tokio = { version = "1.28.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
axum = { version = "0.8.1", features = ["macros"] }
tower-http = { version = "0.6.1", features = ["cors", "trace"] }
url = "2.3.1"
chrono = { version = "0.4.24", features = ["serde"] }
reqwest = { version = "0.12.7", features = ["json", "rustls-tls"] }
serde = { version = "1.0.160", features = ["derive"] }
serde_derive = "^1.0"
serde_json = "1.0.96"
cid = { version = "0.11.1", features = ["serde"] }
dotenvy = "0.15.7"
anyhow = "1.0.81"
