[package]
name = "lexicon"
version = "0.2.0"
edition = "2021"
publish = true
description = "Bluesky API library"
license = "Apache-2.0"
keywords = ["bluesky", "atproto"]

[dependencies]
cid = { version = "0.11.1", features = ["serde"] }
chrono = { version = "0.4.24", features = ["serde"] }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
serde_cbor = "0.11.2"
serde_derive = "^1.0"
serde_bytes = "0.11.9"