[package]
name = "rsky-feedgen"
version = "0.1.0"
authors = ["Rudy Fraser <him@rudyfraser.com>"]
description = "A framework for building AT Protocol feed generators, in Rust."
license = "Apache-2.0"
edition = "2021"
publish = false
homepage = "https://blackskyweb.xyz"
repository = "https://github.com/blacksky-algorithms/rsky/tree/main/rsky-feedgen"
documentation = "https://docs.rs/rsky-feedgen"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
rsky-lexicon = { workspace = true }
axum = { version = "0.8.8", features = ["macros"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "^1.0"
serde_json = "1.0.96"
diesel = { version = "=2.1.5", features = ["chrono", "postgres", "r2d2"] }
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
dotenvy = "0.15"
chrono = "0.4.26"
ipld-core = "0.4.1"
lazy_static = "1.4.0"
base64 = "0.22.1"
bsky-sdk = "0.1.11"
rsky-identity = { workspace = true }
rsky-crypto = { workspace = true }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

