services:
  db:
    container_name: db
    image: postgres:16-bookworm
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 2gb
    env_file:
      - ./postgres.env

  feedgen:
    container_name: feedgen
    image: ghcr.io/theripperoni/feedgen:main
    ports:
      - "8003:8000"
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./feedgen.env

  janitor:
    container_name: janitor
    image: ghcr.io/theripperoni/janitor:main
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./janitor.env

  jetstream:
    container_name: jetstream
    image: ghcr.io/theripperoni/jetstream:main
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./jetstream.env

  stats-viz:
    container_name: stats-viz
    image: ghcr.io/theripperoni/stats-viz:main
    ports:
      - "8002:80"
    restart: unless-stopped
    depends_on:
      - feedgen
    environment:
      - API_KEY=${API_KEY:-test-key}

volumes:
  pgdata: