services:
  db:
    container_name: db
    image: postgres:14.11-bookworm
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./postgres:/var/lib/postgresql/data
    env_file:
      - ./postgres.env

  feedgen:
    container_name: feedgen
    image: ghcr.io/theripperoni/feedgen:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./feedgen.env

  janitor:
    container_name: janitor
    image: ghcr.io/theripperoni/janitor:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./janitor.env

  jetstream:
    container_name: jetstream
    image: ghcr.io/theripperoni/jetstream:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./jetstream.env

  stats-viz:
    container_name: stats-viz
    image: ghcr.io/theripperoni/stats-viz:latest
    restart: unless-stopped
    depends_on:
      - feedgen
    environment:
      - API_KEY=${API_KEY:-test-key}

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - FEEDGEN_DOMAIN=${FEEDGEN_DOMAIN:-localhost}
      - STATS_DOMAIN=${STATS_DOMAIN:-stats.localhost}
    depends_on:
      - feedgen
      - stats-viz

volumes:
  caddy_data:
  caddy_config: